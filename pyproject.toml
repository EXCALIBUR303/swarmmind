[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmmind"
version = "0.1.0"
description = "SWARMMIND — Multi-Agent Robot Swarm Learning and Coordination Simulator"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.0",
    "torch>=2.2,<3.0",
    "pettingzoo>=1.24,<1.25",
    "gymnasium>=0.29,<0.30",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.12,<2.0",
    "matplotlib>=3.8,<4.0",
    "websockets>=12.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["marl*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["frontend/", "tests/fixtures/"]

[tool.pytest.ini_options]
markers = [
    "unit: fast unit tests (default)",
    "slow: slow learning-smoke tests",
    "integration: cross-component integration tests",
]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["marl", "backend"]
omit = ["*/tests/*"]
